name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: 8
  GRADLE_VERSION: '8.14.3'
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=2

jobs:
  build:
    name: 🔨 构建
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      short_version: ${{ steps.version.outputs.short_version }}
      should_release: ${{ steps.check_release.outputs.should_release }}

    steps:
      - name: 📥 检出代码仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ 配置 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: 📦 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/kotlin-dsl
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🐘 配置 Gradle 构建工具
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: 🏷️ 解析版本信息
        id: version
        run: |
          # 从 gradle.properties 读取版本
          BASE_VERSION=$(grep '^version=' gradle.properties | cut -d'=' -f2 | tr -d ' ')
          
          # 添加构建信息
          SHORT_HASH=$(git rev-parse --short=7 HEAD)
          
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            SHORT_VERSION="${BASE_VERSION}-${SHORT_HASH}"
          else
            SHORT_VERSION="${BASE_VERSION}-${SHORT_HASH}"
          fi
          VERSION="v${SHORT_VERSION}"
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "short_version=${SHORT_VERSION}" >> $GITHUB_OUTPUT
          echo "base_version=${BASE_VERSION}" >> $GITHUB_OUTPUT
          
          echo "📦 完整版本: ${VERSION}"
          echo "🏷️ 版本号: ${SHORT_VERSION}"

      - name: 🎯 判断发布条件
        id: check_release
        run: |
          SHOULD_RELEASE="false"
          
          # 仅master分支推送时发布
          if [[ "${{ github.ref }}" == "refs/heads/master" ]] && [[ "${{ github.event_name }}" == "push" ]]; then
            SHOULD_RELEASE="true"
            echo "✅ master分支推送，将创建正式发布"
          else
            echo "ℹ️ 不满足发布条件，仅执行构建和测试"
          fi
          
          echo "should_release=${SHOULD_RELEASE}" >> $GITHUB_OUTPUT

      - name: 📝 更新版本号到 gradle.properties
        run: |
          echo "🔄 更新 gradle.properties 中的版本号为: ${{ steps.version.outputs.short_version }}"
          sed -i "s/^version=.*/version=${{ steps.version.outputs.short_version }}/" gradle.properties
          cat gradle.properties

      - name: 🔧 执行项目构建
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --info

      - name: 🛠️ 构建开发版本API
        run: ./gradlew taboolibBuildApi -PDeleteCode --no-daemon --info

      - name: 📦 保存用户版构建产物
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
            !build/libs/*-api.jar
          retention-days: 30

      - name: 📦 保存API版构建产物
        uses: actions/upload-artifact@v4
        with:
          name: api-artifacts-${{ github.sha }}
          path: |
            build/libs/*-api.jar
          retention-days: 30

  release:
    name: 🎉 创建 GitHub Release
    needs: build
    if: needs.build.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: 📥 检出代码仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📥 获取用户版构建产物
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts-${{ github.sha }}
          path: build/libs/

      - name: 📝 生成更新日志
        id: changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LATEST_TAG" ]; then
            NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes \
              -f tag_name="${{ needs.build.outputs.version }}" \
              -f previous_tag_name="${LATEST_TAG}" \
              --jq '.body')
          else
            NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes \
              -f tag_name="${{ needs.build.outputs.version }}" \
              --jq '.body')
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 🚀 发布新版本
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: BilibiliVideo ${{ needs.build.outputs.version }}
          body: |
            <div align="center">

            ![TabooLib](https://img.shields.io/badge/TabooLib-6.3.0--afd75a7-green) ｜![Minecraft](https://img.shields.io/badge/Minecraft-1.12+-orange) ｜![Java](https://img.shields.io/badge/Java-8+-red) ｜![Build Status](https://img.shields.io/github/actions/workflow/status/BingZi-233/BilibiliVideo/main.yml) ｜![Downloads](https://img.shields.io/github/downloads/BingZi-233/BilibiliVideo/total)

            </div>

            ---

            ${{ steps.changelog.outputs.changelog }}

            ---

            ## 🚀 快速开始

            ### 安装步骤

            1. **下载插件** — 从本页面下载 `BilibiliVideo-${{ needs.build.outputs.short_version }}.jar`
            2. **放置文件** — 将 JAR 文件放入服务器的 `plugins` 目录
            3. **重启服务器** — 插件会自动生成配置文件和数据库

            ### 基本使用

            ```bash
            /bv qrcode              # 生成 B 站登录二维码，扫码绑定账号
            /bv status              # 查看账号绑定状态
            /bv triple <bvid>       # 检测视频三连状态（点赞、投币、收藏）
            /bv reward <bvid>       # 领取三连奖励
            /bv menu                # 打开视频列表
            ```

            ## 📋 系统要求

            - **Java**: 8 或更高版本
            - **服务端**: Bukkit/Spigot/Paper 1.12+
            - **数据库**: SQLite（默认，开箱即用）或 MySQL 5.7+

            ## 🔗 相关链接

            | 资源 | 链接 |
            |------|------|
            | 🐛 问题反馈 | [Issues](https://github.com/BalanceSea/BilibiliVideo/issues) |
            | 💬 讨论交流 | [Discussions](https://github.com/BalanceSea/BilibiliVideo/discussions) |

            ---

            <div align="center">

            **如果这个插件对你有帮助，请给个 ⭐ Star 支持一下！**

            [报告问题](https://github.com/BalanceSea/BilibiliVideo/issues/new/choose) | [请求功能](https://github.com/BalanceSea/BilibiliVideo/issues/new?labels=enhancement) | [加入讨论](https://github.com/BalanceSea/BilibiliVideo/discussions)

            </div>
          draft: false
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ 发布完成通知
        if: success()
        run: |
          echo "🎉 GitHub Release 发布成功"
          echo "📦 发布版本: ${{ needs.build.outputs.version }}"
          echo "🔗 Release 页面: https://github.com/${{ github.repository }}/releases/tag/${{ needs.build.outputs.version }}"
          echo "📥 下载地址: https://github.com/${{ github.repository }}/releases/download/${{ needs.build.outputs.version }}/BilibiliVideo-${{ needs.build.outputs.short_version }}.jar"